<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全车辆发动机试听 · 地下狂飙</title><style>body{margin:0;background:#0c1418;color:#eaf0ed;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px 20px}h1{font-size:30px}p{color:#a9bbbc;line-height:1.7}a{color:#d2ed83}.cars,.modes{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button{background:#1c2b32;border:1px solid #52656b;color:white;padding:15px;border-radius:9px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#d2ed83;color:#14211c}.panel{padding:25px;background:#142229;border:1px solid #34484e;border-radius:14px}#rpm{font-size:48px;color:#d2ed83;font-variant-numeric:tabular-nums}#stop{background:#743a37}small{color:#9cabae}#status{min-height:25px}input{width:min(100%,350px)}@media(max-width:500px){main{padding:18px}.cars button{flex:1 1 40%}h1{font-size:25px}}</style></head><body><main><a href="/">← 返回游戏</a><h1>全车辆发动机试听</h1><p>游戏内全部 13 辆车，使用与比赛相同的发动机音效，分别试听怠速、中转速、高转速和渐进拉转，不混入轮胎、风声和配乐。911、R34、Supra、M4 已分别重制中高转速音源；当前为 AI 音效与合成声的组合，不是原厂实录。</p><div class="cars" id="cars"></div><section class="panel"><h2 id="name">法拉利 458 Italia</h2><div id="rpm">—</div><small>模拟转速 RPM</small><div class="modes"><button data-mode="idle">怠速</button><button data-mode="mid">中转速</button><button data-mode="high">高转速</button><button data-mode="sweep">渐进拉转</button><button data-mode="lift">收油回落</button><button id="stop">停止</button></div><label>试听音量 <input id="volume" type="range" min="0" max="100" value="45"></label><p id="status" role="status">选择一种试听模式开始播放</p></section><p>建议先用中等音量试听，再比较不同车型。如果仍有不自然的声音，请记下车型和转速阶段。</p><a href="/audio/CREDITS.md">查看素材来源与处理说明</a></main><script type="module" src="/src/sound-preview.ts"></script></body></html>
