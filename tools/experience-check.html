<!doctype html><meta charset="utf-8"><title>驾驶体验检查</title>
<link rel="stylesheet" href="/src/menu.css"><body style="background:#13212a;color:white">
<h1>帧数提示验证</h1><button id="run">运行低帧率检查</button><pre id="result">等待检查</pre>
<script type="module">
import {mountExperience} from '/src/experience.ts';
// Test-only touch-device emulation; orientation still follows the real viewport.
if(new URLSearchParams(location.search).has('mobile')){const media=window.matchMedia.bind(window);window.matchMedia=q=>media(q.replace('(pointer: coarse) and ',''));}
let quality='balanced';const ui=mountExperience(q=>quality=q);
document.querySelector('#run').onclick=()=>{
 const checks=[];const sample=(fps,seconds)=>{for(let i=0;i<fps*seconds;i++)ui.update(1/fps,true,quality);};
 sample(60,10);checks.push(['60 FPS 不提示',document.querySelector('#fpsAdvice').hidden]);
 sample(24,2);checks.push(['短时掉帧不提示',document.querySelector('#fpsAdvice').hidden]);
 sample(24,6);checks.push(['持续低帧建议流畅',!document.querySelector('#fpsAdvice').hidden&&document.querySelector('#fpsAdvice').textContent.includes('流畅')]);
 document.querySelector('#fpsAdvice button').click();checks.push(['确认后切换流畅',quality==='low']);
 sample(24,60);checks.push(['流畅档不重复提示',document.querySelector('#fpsAdvice').hidden]);
 quality='high';sample(24,10);checks.push(['最高档建议均衡',!document.querySelector('#fpsAdvice').hidden&&document.querySelector('#fpsAdvice').textContent.includes('均衡')]);
 document.querySelector('#fpsToggle').click();checks.push(['开关显示帧数',!document.querySelector('#fpsValue').hidden&&document.querySelector('#fpsValue').textContent==='24 FPS']);
 ui.update(1/60,false,quality);checks.push(['离开比赛隐藏面板',document.querySelector('#performancePanel').hidden]);
 document.querySelector('#result').textContent=checks.map(([name,ok])=>(ok?'PASS ':'FAIL ')+name).join('\n');
};
</script>
