<!doctype html><meta charset="utf-8"><title>Seven city visual review</title>
<style>body{background:#111820;color:#eee;font:14px sans-serif;margin:12px}button{padding:8px;margin:3px}canvas{display:block;width:844px;height:390px}pre{white-space:pre-wrap}</style>
<nav id="cities"></nav><button id="race">赛道鸟瞰</button><button id="portrait">城市巡览</button><pre id="report"></pre><canvas></canvas>
<script type="module">
import * as T from 'three';import {createCityShowcase} from '/src/environment/showcase.ts';import {EXPANDED_CITIES} from '/src/environment/city-icons.ts';import {Atmosphere} from '/src/environment/atmosphere.ts';import {CITY_PROFILES} from '/src/environment/profiles.ts';import {CIRCUITS,createTrackCurve} from '/src/circuits/circuit.ts';import {buildCircuitVenue} from '/src/circuits/venue.ts';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(844,390,false);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(47,844/390,2,12000),sun=new T.DirectionalLight(),ambient=new T.AmbientLight(),hemi=new T.HemisphereLight();scene.add(sun,ambient,hemi);const atmosphere=new Atmosphere(renderer,scene,sun,ambient,hemi);let current,resources=[],world,city='tokyo',mode='portrait',time=0;
function load(key){try{city=key;time=0;current?.dispose();current=null;world?.removeFromParent();resources.forEach(r=>r.dispose());resources=[];
if(mode==='portrait'){current=createCityShowcase(key);scene.add(current.group);atmosphere.set(current.profile,false);scene.fog=new T.Fog(current.profile.sky==='night'?0x152538:0xbbbac1,750,2600);document.querySelector('#report').textContent=JSON.stringify({city:key,mode,title:current.title,buildings:current.buildings,batches:current.batches});}
else{const meta=CIRCUITS[key],curve=createTrackCurve({theme:key}),n=1400,points=Array.from({length:n},(_,i)=>curve.getPointAt(i/n)),normals=points.map((_,i)=>{const t=curve.getTangentAt(i/n);return new T.Vector3(-t.z,0,t.x)});world=new T.Group();scene.add(world);const stats=buildCircuitVenue(world,points,normals,key,resources,meta.length,meta.halfWidth);const vertices=[],indices=[];points.forEach((p,i)=>{for(const side of [-1,1])vertices.push(p.x+normals[i].x*meta.halfWidth*side,0,p.z+normals[i].z*meta.halfWidth*side);const a=i*2,b=((i+1)%n)*2;indices.push(a,a+1,b,a+1,b+1,b);});const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(vertices,3));geo.setIndex(indices);geo.computeVertexNormals();const mat=new T.MeshStandardMaterial({color:0x30383d,side:T.DoubleSide});resources.push(geo,mat);world.add(new T.Mesh(geo,mat));atmosphere.set(CITY_PROFILES[key],false);scene.fog=new T.Fog(0x99acbc,2000,12000);camera.position.copy(stats.focus).add(new T.Vector3(0,stats.previewRadius*.65,stats.previewRadius*.7));camera.lookAt(stats.focus);document.querySelector('#report').textContent=JSON.stringify({city:key,mode,buildings:stats.buildings,landmarks:stats.urbanLandmarks,barriers:stats.roadsideBarriers});}
}catch(e){document.querySelector('#report').textContent=e.stack}}
for(const key of EXPANDED_CITIES){const b=document.createElement('button');b.textContent=key;b.onclick=()=>load(key);document.querySelector('#cities').append(b)}document.querySelector('#race').onclick=()=>{mode='race';load(city)};document.querySelector('#portrait').onclick=()=>{mode='portrait';load(city)};load(city);
renderer.setAnimationLoop(()=>{time+=1/60;if(current)current.view(camera,time);sun.position.set(150,300,200);renderer.render(scene,camera)});
</script>
