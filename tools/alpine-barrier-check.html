<!doctype html><meta charset="utf-8"><title>奥地利与瑞士护栏验收</title>
<style>body{background:#132129;color:#e0ead7;font:15px system-ui}button{padding:12px;margin:4px}iframe{width:100%;height:620px;border:0}pre{white-space:pre-wrap}</style>
<button data-track="redbull">红牛环发车</button><button data-track="arosa">阿罗萨发车</button><button data-sweep="redbull">红牛环全线贴地</button><button data-sweep="arosa">阿罗萨全线贴地</button><button data-view=".42">中段驾驶画面</button><button data-view=".7">后段驾驶画面</button><button data-edge="redbull">红牛环防跌落</button><button data-edge="arosa">阿罗萨防跌落</button><pre id="report">选择检查项目</pre><iframe src="/"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),report=document.querySelector('#report');
for(const button of document.querySelectorAll('button'))button.onclick=async()=>{report.textContent='检查中…';try{const api=frame.contentWindow.__velocity;report.textContent=JSON.stringify(await(button.dataset.track?api.alpineAcceptance(button.dataset.track):button.dataset.sweep?api.groundingSweep(button.dataset.sweep):button.dataset.edge?api.groundingSweep(button.dataset.edge,true):api.sceneryView(Number(button.dataset.view))),null,2);}catch(e){report.textContent='FAIL '+e.stack;}};
</script>
