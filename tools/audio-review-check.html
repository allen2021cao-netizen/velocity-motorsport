<!doctype html><meta charset="utf-8"><title>Audio review signal verification</title><button id="run">Run review audio checks</button><pre id="out">Ready</pre><script type="module">
import {ReviewEngine} from '/src/audio-review/engine.ts';import {REVIEW_PROFILES} from '/src/audio-review/profiles.ts';import {reviewFrame} from '/src/audio-review/model.ts';
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out'),results=[];out.textContent='Running';try{for(const p of REVIEW_PROFILES)for(const rate of [44100,48000])for(const mode of ['idle','mid','high','straight','rival']){const ctx=new OfflineAudioContext(2,rate*1.5,rate),master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination);const engine=new ReviewEngine(ctx,master);await engine.select(p);engine.update(reviewFrame(p,mode,mode==='straight'?20:2));const b=await ctx.startRendering(),x=b.getChannelData(0);let sum=0,peak=0;for(let i=Math.floor(rate*.5);i<x.length;i++){sum+=x[i]*x[i];peak=Math.max(peak,Math.abs(x[i]));}const rms=Math.sqrt(sum/(x.length-Math.floor(rate*.5)));results.push({car:p.id,rate,mode,rms,peak});out.textContent=JSON.stringify({running:true,completed:results.length,last:results.at(-1)});}
const differences=[];for(const p of REVIEW_PROFILES)for(const mode of ['idle','mid','high','straight','rival']){const a=results.find(x=>x.car===p.id&&x.mode===mode&&x.rate===44100),b=results.find(x=>x.car===p.id&&x.mode===mode&&x.rate===48000);differences.push({car:p.id,mode,rmsRelative:Math.abs(a.rms-b.rms)/Math.max(a.rms,b.rms)});}const pass=results.every(x=>x.rms>.0002&&x.peak<.95)&&differences.every(x=>x.rmsRelative<.08);out.textContent=JSON.stringify({pass,results,differences},null,2);
}catch(e){out.textContent=JSON.stringify({pass:false,error:String(e),results});}};
</script>
