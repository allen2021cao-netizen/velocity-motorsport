<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#152029;color:white;font:14px system-ui}button{padding:8px}iframe{width:100%;height:700px;border:0}pre{margin:8px}</style><button data-key="suzuka">铃鹿巡览</button><button data-key="fuji">富士巡览</button><button data-key="fuji" data-time="165">富士山景</button><button data-sweep="suzuka">铃鹿贴地</button><button data-sweep="fuji">富士贴地</button><pre id="report">选择检查项目</pre><iframe src="/"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=async()=>{const r=document.querySelector('#report'),api=document.querySelector('iframe').contentWindow.__velocity;r.textContent='检查中…';try{r.textContent=JSON.stringify(await(b.dataset.sweep?api.groundingSweep(b.dataset.sweep,true):api.japaneseTourView(b.dataset.key,Number(b.dataset.time||0))),null,2);}catch(e){r.textContent='FAIL '+e.stack;}};</script>
