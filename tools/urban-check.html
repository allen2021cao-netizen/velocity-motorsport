<!doctype html><meta charset="utf-8"><title>City circuit checks</title><button id="run">Check four cities</button><pre id="out">Ready</pre><script type="module">
import * as T from 'three';import {createTrackCurve,CIRCUITS} from '/src/circuits/circuit.ts';import {buildCircuitVenue} from '/src/circuits/venue.ts';
document.querySelector('#run').onclick=()=>{try{const reports=[];for(const [key,meta]of Object.entries(CIRCUITS)){const curve=createTrackCurve({theme:key}),points=Array.from({length:1200},(_,i)=>curve.getPointAt(i/1200)),normals=Array.from({length:1200},(_,i)=>{const t=curve.getTangentAt(i/1200);return new T.Vector3(-t.z,0,t.x);}),world=new T.Group(),resources=[];const report=buildCircuitVenue(world,points,normals,key,resources,meta.length,meta.halfWidth);reports.push({key,buildings:report.urbanBuildings,landmarks:report.urbanLandmarks,barriers:report.roadsideBarriers,clearance:report.minimumBuildingClearance,separation:report.minimumBuildingSeparation,instances:report.instances,batches:report.batches});for(const r of resources)r.dispose();}document.querySelector('#out').textContent=JSON.stringify({pass:reports.every(r=>r.buildings>60&&r.landmarks>0&&r.barriers===0&&r.clearance>0&&r.separation>=3.9),reports},null,2);}catch(e){document.querySelector('#out').textContent=e.stack;}};
</script>
