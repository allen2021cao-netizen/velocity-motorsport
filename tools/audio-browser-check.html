<!doctype html><meta charset="utf-8"><title>Race audio verification</title><button id="start">Run audio checks</button><pre id="out">Ready</pre><script type="module">
import {RaceAudio} from '/src/race-audio.ts';import {AUDIO_ASSETS} from '/src/engine-banks.ts';
const out=document.querySelector('#out');document.querySelector('#start').onclick=async()=>{try{
const ac=new AudioContext(),master=ac.createGain();master.gain.value=.6;const capture=ac.createScriptProcessor(2048,2,2);master.connect(capture);capture.connect(ac.destination);const audio=new RaceAudio(ac,master);await ac.resume();const stats={engine:{sum:0,n:0,peak:0},paused:{sum:0,n:0,peak:0},heavy:{sum:0,n:0,peak:0},f40:{sum:0,n:0,peak:0},veneno:{sum:0,n:0,peak:0},p911:{sum:0,n:0,peak:0},r34:{sum:0,n:0,peak:0},supra:{sum:0,n:0,peak:0},m3:{sum:0,n:0,peak:0}};let phase='engine';capture.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0),v=stats[phase];for(const a of x){v.sum+=a*a;v.n++;v.peak=Math.max(v.peak,Math.abs(a));}};
const initial=performance.now();while(audio.snapshot().loaded.length+audio.snapshot().failed.length<AUDIO_ASSETS.length&&performance.now()-initial<15000)await new Promise(r=>setTimeout(r,100));if(audio.snapshot().failed.length||audio.snapshot().loaded.length!==AUDIO_ASSETS.length)throw Error(JSON.stringify(audio.snapshot()));
let frame={active:true,type:'458',top:325,speed:40,throttle:.8,brake:0,slip:0,wet:0,camera:0,countdown:false,fuel:100,opponents:[]};let last=performance.now();const timer=setInterval(()=>{const now=performance.now();audio.update(frame,(now-last)/1000);last=now;},16);const sleep=ms=>new Promise(r=>setTimeout(r,ms));
await sleep(2000);for(const [type,key] of [['f40','f40'],['diablo','veneno'],['p911','p911'],['r34','r34'],['supra','supra'],['m3','m3']]){frame={...frame,type,speed:0,throttle:1,countdown:true};phase=key;await sleep(2200);}frame={...frame,type:'viper',countdown:false,speed:65,slip:9,wet:.5,opponents:[{x:1,z:2,speed:70,type:'diablo'},{x:-1,z:-3,speed:65,type:'c5'},{x:0,z:5,speed:60,type:'r34'}]};phase='heavy';for(let i=0;i<5;i++){audio.impact(.8);await sleep(250);}await sleep(750);frame={...frame,type:'p911',camera:1,slip:0};await sleep(500);frame.active=false;audio.silence();await sleep(700);phase='paused';await sleep(500);clearInterval(timer);capture.disconnect();await ac.close();const results=Object.fromEntries(Object.entries(stats).map(([k,v])=>[k,{rms:Math.sqrt(v.sum/Math.max(1,v.n)),peak:v.peak}]));const pass=['p911','r34','supra','m3'].every(k=>results[k].rms>.002&&results[k].peak<.95)&&results.f40.rms>.002&&results.veneno.rms>.002&&results.f40.peak<.95&&results.veneno.peak<.95&&results.engine.rms>.002&&results.heavy.peak<.95&&results.paused.rms<.0001;out.textContent=JSON.stringify({pass,results,assets:audio.snapshot().loaded},null,2);if(!pass)throw Error('Audio signal check failed');
}catch(e){out.textContent+='\nFAIL '+e.message;}};
</script>
