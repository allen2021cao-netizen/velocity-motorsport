<!doctype html><meta charset="utf-8"><button id="run">Run race release checks</button><pre id="out">Ready</pre><script type="module">
import {RaceAudio} from '/src/race-audio.ts';
const out=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{try{const reports=[];for(const paused of [false,true]){const ac=new OfflineAudioContext(2,96000,48000),master=ac.createGain();master.gain.value=.6;master.connect(ac.destination);const audio=new RaceAudio(ac,master),frame={active:true,type:'diablo',top:355,speed:80,throttle:1,brake:0,slip:8,wet:1,camera:0,countdown:false,fuel:100,opponents:[{x:-2,z:0,speed:80,type:'gt40'},{x:2,z:0,speed:80,type:'clk'},{x:0,z:-4,speed:80,type:'458'}],surface:{curb:1,grass:1,rough:1,wet:1,tunnel:1},grip:1};audio.update(frame,.1);const deadline=performance.now()+15000;while(audio.snapshot().loaded.length<10){if(audio.snapshot().failed.length||performance.now()>deadline)throw Error(JSON.stringify(audio.snapshot()));await new Promise(r=>setTimeout(r,50));}for(let i=0;i<40;i++)audio.update(frame,.1);audio.impact(.8);if(paused)audio.silence();const b=await ac.startRendering(),x=b.getChannelData(0);let sum=0,peak=0;for(let i=24000;i<x.length;i++){sum+=x[i]*x[i];peak=Math.max(peak,Math.abs(x[i]));}reports.push({paused,rms:Math.sqrt(sum/(x.length-24000)),peak,snapshot:audio.snapshot()});}out.textContent=JSON.stringify({pass:reports[0].rms>.005&&reports[0].peak<.95&&reports[1].rms<.0001,reports},null,2);}catch(e){out.textContent=JSON.stringify({pass:false,error:String(e)});}};
</script>
