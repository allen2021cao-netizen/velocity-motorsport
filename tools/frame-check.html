<!doctype html><meta charset="utf-8"><title>驾驶帧耗时检查</title>
<style>body{background:#132129;color:white;font:14px system-ui}button{padding:10px}iframe{width:100%;height:620px;border:0}pre{max-height:150px;overflow:auto;white-space:pre-wrap}</style>
<button data-car="r34" data-track="shanghai">GTR 上海</button><button data-car="458" data-track="shanghai">458 上海</button><button data-car="r34" data-track="redbull">GTR 红牛环</button><button data-car="r34" data-track="suzuka">GTR 铃鹿</button><button data-car="r8" data-track="shanghai">R8 上海</button><pre>选择检查</pre><iframe src="/"></iframe>
<script>const results=[];document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const out=document.querySelector('pre');document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='测量中…';try{const result=await document.querySelector('iframe').contentWindow.__velocity.performanceRun(b.dataset.track,b.dataset.car);results.push(result);out.textContent=JSON.stringify(results,null,2);}catch(e){out.textContent=String(e);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}});</script>
